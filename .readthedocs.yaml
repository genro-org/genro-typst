# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "22"
  jobs:
    pre_build:
      - python tools/generate_reference.py --check
      - npm ci --prefix js --ignore-scripts
      - npm run build:playground --prefix js

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: true
