[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genro-typst"
version = "0.0.1"
description = "Print documents described with genro-builders and typeset with Typst"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Genropy Team", email = "info@genropy.org" }
]
keywords = ["genropy", "print", "pdf", "typst", "document-generation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
    "Typing :: Typed",
]
dependencies = [
    "genro-builders>=0.29.0",
    "typst==0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/genro-org/genro-typst"

[tool.hatch.build.targets.wheel]
packages = ["src/genro_typst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["genro_typst"]
mypy_path = "src"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
    "PIE790",   # `...` body of the @element declarations, as in genro-builders
]
